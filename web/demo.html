<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <title>Dependency Risk Desk v2</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap"
    />

    <div class="app">
      <header>
        <h1>Dependency Risk Desk</h1>
        <div class="view-part" id="hdr-pt">
          <select id="pos" aria-label="Position"></select>
          <label class="hin" for="size"
            ><span><span id="size-lbl"></span> <span id="size-mark"></span></span
            ><input id="size" type="text" inputmode="decimal" autocomplete="off"
          /></label>
          <label class="hin" for="alt"
            ><span id="alt-lbl"></span><input id="alt" type="text" inputmode="decimal"
          /></label>
          <select id="replay" aria-label="Load a past incident pattern"></select>
          <p class="note hline" id="sizeLine"></p>
          <span class="stamp" id="stamp"></span>
        </div>
        <div class="view-part" id="hdr-vault" hidden>
          <label class="hin wide" for="v-addr"
            ><span id="v-addr-lbl"></span
            ><input id="v-addr" type="text" spellcheck="false" autocomplete="off"
          /></label>
          <select id="v-pick" aria-label="Vaults in the list"></select>
          <label class="hin" for="v-amt"
            ><span id="v-amt-lbl"></span><input id="v-amt" type="text" inputmode="decimal"
          /></label>
          <label class="hin" for="v-alt"
            ><span id="v-alt-lbl"></span><input id="v-alt" type="text" inputmode="decimal"
          /></label>
          <label class="hin" for="v-hz"
            ><span id="v-hz-lbl"></span><input id="v-hz" type="text" inputmode="decimal"
          /></label>
        </div>
        <div class="mode" role="group" aria-label="Page view">
          <button data-page="pt" aria-pressed="true">Position (PT)</button
          ><button data-page="vault" aria-pressed="false">Vaults</button>
        </div>
      </header>
      <div class="banner" id="banner" hidden></div>

      <div class="view-part" id="view-pt">
      <div class="banner" id="pastBanner" hidden></div>

      <section class="panel steps" id="steps" aria-label="Incident to test">
        <div class="step">
          <label class="q" for="node"><i>1</i><span id="q1"></span></label>
          <select id="node"></select>
          <span class="note" id="n1"></span>
        </div>
        <div class="step">
          <label class="q" for="fail"><i>2</i>What happens, how bad, how long?</label>
          <select id="fail"></select>
          <div class="slide">
            <div class="tcol">
              <input type="range" id="sev" aria-label="Severity" />
              <div id="zoneBox"></div>
            </div>
            <output id="sevOut" for="sev"></output>
          </div>
          <span class="note" id="sevNote"></span>
          <span class="note" id="durNote"></span>
        </div>
      </section>

      <main class="cols">
        <div class="main">
          <section class="panel">
            <div class="phead">
              <h2>What this position depends on</h2>
              <div
                class="mode sm"
                role="group"
                aria-label="How to show the dependencies"
              >
                <button id="v-list" data-view="list" aria-pressed="true">
                  Layers</button
                ><button id="v-graph" data-view="graph" aria-pressed="false">
                  Graph
                </button>
              </div>
            </div>
            <div class="rail" id="rail" role="group" aria-label="How long the incident lasts">
              <div class="rhead">
                <span class="rlbl" id="railLbl"></span>
                <button class="btn rplay" id="play" aria-pressed="false"></button>
                <span class="rrec" id="rec"></span>
              </div>
              <div class="rtrack" id="rtrack">
                <div class="rline"></div>
                <div id="rmarks"></div>
                <div
                  class="rthumb"
                  id="rthumb"
                  role="slider"
                  tabindex="0"
                  aria-label="How long the incident lasts"
                  aria-valuemin="1"
                  aria-valuemax="4320"
                ></div>
              </div>
              <div class="raxis" id="raxis"></div>
              <ul class="revents" id="revents"></ul>
              <details class="tl" id="d-tl">
                <summary id="tlSum"></summary>
                <div id="tl"></div>
              </details>
            </div>
            <div class="chain" id="chain"></div>
            <details class="spread" id="d-spread">
              <summary id="spreadSum"></summary>
              <ol id="spread"></ol>
            </details>
            <div class="legend">
              <span><i class="a"></i>Path of this incident</span
              ><span><i></i>Read on chain or from an API</span
              ><span><i class="d"></i>Assumption or not verified</span
              ><span
                ><span class="asm">Dashed underline</span> = our
                assumption</span
              ><span
                ><span class="gr">A</span>–<span class="gr D">D</span> evidence
                grade, source in the drawer</span
              >
            </div>
          </section>
        </div>
        <aside class="side">
          <section
            class="panel decision"
            id="decision"
            aria-live="polite"
          ></section>
          <section class="panel exit" id="exit"></section>
        </aside>
      </main>

      </div>

      <main class="view-part" id="view-vault" hidden>
        <div class="banner vmsg" id="v-msg" hidden></div>
        <section class="panel steps" id="v-steps" aria-label="Vault incident to test">
          <div class="step">
            <label class="q" for="v-inc"><i>1</i><span id="v-q1"></span></label>
            <select id="v-inc"></select>
            <span class="note" id="v-n1"></span>
          </div>
          <div class="step" id="v-sevstep">
            <label class="q" for="v-sev"><i>2</i><span id="v-q2"></span></label>
            <div class="slide">
              <div class="tcol">
                <input type="range" id="v-sev" min="0" max="1000" step="1" aria-label="Severity" />
                <div class="vticks" id="v-ticks"></div>
                <div id="v-zones"></div>
              </div>
              <output id="v-sevOut" for="v-sev"></output>
            </div>
            <span class="note" id="v-sevNote"></span>
          </div>
        </section>
        <div class="cols" id="v-cols">
          <section class="panel">
            <div class="phead">
              <h2 id="v-chainHead"></h2>
              <div class="mode sm" role="group" aria-label="How to show the vault's dependencies">
                <button data-vdisp="list" aria-pressed="true">Layers</button
                ><button data-vdisp="graph" aria-pressed="false">Graph</button>
              </div>
            </div>
            <div class="vchain" id="v-chain"></div>
          </section>
          <aside class="side">
            <section class="panel decision" id="v-decision" aria-live="polite"></section>
          </aside>
        </div>
      </main>
    </div>

    <div class="drawer" id="drawer" hidden>
      <div class="in" id="drawerIn"></div>
    </div>

    <script src="../sample_data/dashboard.sample.js"></script>
    <script src="risk_model.js"></script>
    <script src="../sample_data/vaults.sample.js"></script>
    <script src="demo.copy.js"></script>
    <script src="demo.js"></script>
    <script src="vault.js"></script>
  </body>
</html>
