<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <title>Dependency Risk Desk v2</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap"
    />

    <div class="app">
      <div class="proto" id="proto">
        <span><b>Prototype control</b> (not part of the product)</span>
        <label for="feed"
          >Detector feed:
          <select id="feed"></select
        ></label>
        <span id="protoNote"></span>
      </div>
      <header>
        <h1>Dependency Risk Desk</h1>
        <select id="pos" aria-label="Position"></select>
        <select id="replay" aria-label="Load a past incident pattern"></select>
        <span class="stamp" id="stamp"></span>
      </header>
      <div class="banner" id="banner" hidden></div>

      <section class="panel steps" id="steps" aria-label="Incident to test">
        <div class="step">
          <label class="q" for="node"><i>1</i><span id="q1"></span></label>
          <select id="node"></select>
          <span class="note" id="n1"></span>
        </div>
        <div class="step">
          <label class="q" for="fail"><i>2</i>What happens, and how bad?</label>
          <select id="fail"></select>
          <div class="slide">
            <div class="tcol">
              <input type="range" id="sev" aria-label="Severity" />
              <div id="zoneBox"></div>
            </div>
            <output id="sevOut" for="sev"></output>
          </div>
          <span class="note" id="sevNote"></span>
        </div>
      </section>

      <main class="cols">
        <div class="main">
          <section class="panel">
            <div class="phead">
              <h2>What this position depends on</h2>
              <div
                class="mode sm"
                role="group"
                aria-label="How to show the dependencies"
              >
                <button id="v-list" data-view="list" aria-pressed="true">
                  Layers</button
                ><button id="v-graph" data-view="graph" aria-pressed="false">
                  Graph
                </button>
              </div>
            </div>
            <div class="chain" id="chain"></div>
            <div class="legend">
              <span><i class="a"></i>Path of this incident</span
              ><span><i></i>Read on chain or from an API</span
              ><span><i class="d"></i>Assumption or not verified</span
              ><span
                ><span class="asm">Dashed underline</span> = our
                assumption</span
              ><span
                ><span class="gr">A</span>–<span class="gr D">D</span> evidence
                grade, source in the drawer</span
              >
            </div>
          </section>
        </div>
        <aside class="side">
          <section
            class="panel decision"
            id="decision"
            aria-live="polite"
          ></section>
          <section class="panel exit" id="exit"></section>
        </aside>
      </main>

      <details class="adv" id="d-adv">
        <summary>Assumptions you can change</summary>
        <div>
          <label for="book"
            >Position as a share of the book, %<input
              type="number"
              id="book"
              min="1"
              max="100"
              step="1"
          /></label>
          <label for="alt"
            >Cash earns after selling, % APY<input
              type="number"
              id="alt"
              min="0"
              max="50"
              step="0.01"
          /></label>
          <p class="note" id="advNote"></p>
        </div>
      </details>
    </div>

    <div class="drawer" id="drawer" hidden>
      <div class="in" id="drawerIn"></div>
    </div>

    <script src="../sample_data/dashboard.sample.js"></script>
    <script src="risk_model.js"></script>
    <script src="demo.js"></script>
  </body>
</html>
