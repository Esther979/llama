<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <title>Dependency Risk Desk v2</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap"
    />

    <div class="app">
      <header>
        <h1>Dependency Risk Desk</h1>
        <div class="view-part" id="hdr-pt">
          <label class="hin hpos" for="pos"
            ><span id="pos-lbl"></span><select id="pos"></select
          ></label>
          <button type="button" class="link wadd" id="walletAdd"></button>
          <label class="hin wide" id="walletBox" for="wallet" hidden
            ><span id="wallet-lbl"></span
            ><input id="wallet" type="text" list="walletList" spellcheck="false" autocomplete="off"
          /></label>
          <datalist id="walletList"></datalist>
          <label class="hin" for="size"
            ><span><span id="size-lbl"></span> <span id="size-mark"></span></span
            ><input id="size" type="text" inputmode="decimal" autocomplete="off"
          /></label>
          <p class="note hline wmsg" id="walletMsg" hidden></p>
          <p class="note hline" id="sizeLine"></p>
        </div>
        <div class="view-part" id="hdr-vault" hidden>
          <label class="hin wide" for="v-addr"
            ><span id="v-addr-lbl"></span
            ><input id="v-addr" type="text" spellcheck="false" autocomplete="off"
          /></label>
          <select id="v-pick" aria-label="Vaults in the list"></select>
          <label class="hin" for="v-amt"
            ><span id="v-amt-lbl"></span><input id="v-amt" type="text" inputmode="decimal"
          /></label>
          <label class="hin" for="v-alt"
            ><span id="v-alt-lbl"></span><input id="v-alt" type="text" inputmode="decimal"
          /></label>
        </div>
        <div class="mode" role="group" aria-label="Page view">
          <button data-page="pt" aria-pressed="true">Position (PT)</button
          ><button data-page="vault" aria-pressed="false">Vaults</button>
        </div>
      </header>
      <div class="banner" id="banner" hidden></div>

      <div class="view-part" id="view-pt">

      <section class="panel steps" id="steps" aria-label="Incident to test">
        <div class="smode">
          <span class="q" id="simLbl"></span>
          <div class="mode sm" role="group" aria-label="How to set the incident">
            <button data-mode="past" aria-pressed="true"></button
            ><button data-mode="manual" aria-pressed="false"></button>
          </div>
        </div>
        <div class="ctrls">
          <div class="ctl">
            <span class="q" id="q1"></span>
            <!-- past mode: the past incident (line 1) and the incident type it sets (line 2, #ro1) -->
            <span class="pastwrap">
              <select id="replay" aria-label="Past incident" aria-describedby="pastBanner"></select>
              <button type="button" class="pinfo" id="pastInfo" aria-describedby="pastBanner">*</button>
              <div class="banner ptip" id="pastBanner" role="tooltip" hidden></div>
            </span>
            <div class="casc" id="casc">
              <button type="button" class="cbtn" id="incBtn" aria-haspopup="menu" aria-expanded="false"
                ><span id="incTxt"></span></button>
              <div class="cmenu" id="incMenu" role="menu" hidden></div>
            </div>
            <p class="ro" id="ro1" hidden></p>
          </div>
          <div class="ctl">
            <label class="q" for="sev" id="q2"></label>
            <p class="ro" id="ro2" hidden></p>
            <div class="slide" id="sevRow">
              <div class="tcol"><input type="range" id="sev" aria-label="Severity" /></div>
              <output id="sevOut" for="sev"></output>
            </div>
          </div>
          <div class="ctl">
            <label class="q" for="alt" id="alt-lbl"></label>
            <div class="slide">
              <div class="tcol"><input type="range" id="alt" min="0" max="10" step="0.01" /></div>
              <output id="altOut" for="alt"></output>
            </div>
          </div>
        </div>
        <div class="tframe">
            <div class="rail" id="rail" role="group" aria-label="How long the incident lasts">
              <div class="rhead">
                <span class="q rq"></span>
                <label class="rlbl" for="durIn"><span class="rlt"></span>
                  <input id="durIn" class="rdur" type="text" autocomplete="off" spellcheck="false"
                /></label>
                <button class="btn rplay" id="play" aria-pressed="false"></button>
                <span class="rrec" id="rec"></span>
              </div>
              <div class="rtrack" id="rtrack">
                <div class="rline"></div>
                <div id="rmarks"></div>
                <div
                  class="rthumb"
                  id="rthumb"
                  role="slider"
                  tabindex="0"
                  aria-label="How long the incident lasts"
                  aria-valuemin="1"
                  aria-valuemax="4320"
                ></div>
              </div>
              <div class="raxis" id="raxis"></div>
            </div>
        </div>
      </section>

      <main class="cols">
        <div class="main">
          <section class="panel">
            <div class="phead">
              <h2>Dependency mapping</h2>
              <div
                class="mode sm"
                role="group"
                aria-label="How to show the dependencies"
              >
                <button id="v-list" data-view="list" aria-pressed="true" aria-label="Layers" title="Layers">
                  <svg class="dicon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M2 8h12M2 12.5h12" /></svg></button
                ><button id="v-graph" data-view="graph" aria-pressed="false" aria-label="Graph" title="Graph">
                  <svg class="dicon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.6 5.4 7.2 10.9M11.4 5.4 8.8 10.9M5.6 3.8h4.8" /><circle cx="3.6" cy="3.8" r="2" /><circle cx="12.4" cy="3.8" r="2" /><circle cx="8" cy="12.4" r="2" /></svg></button>
              </div>
            </div>
            <div class="chain" id="chain"></div>
            <details class="spread" id="d-spread">
              <summary id="spreadSum"></summary>
              <ol id="spread"></ol>
            </details>
            <details class="tl" id="d-tl">
              <summary id="tlSum"></summary>
              <div id="tl"></div>
            </details>
            <div class="legend">
              <span><i class="a"></i>Path of this incident</span
              ><span><i></i>Read on chain or from an API</span
              ><span><i class="d"></i>Assumption or not verified</span
              ><span
                ><span class="asm">Dashed underline</span> = our
                assumption</span
              >
            </div>
          </section>
        </div>
        <aside class="side">
          <section
            class="panel decision"
            id="decision"
            aria-live="polite"
          ></section>
          <section class="panel exit" id="exit"></section>
        </aside>
      </main>

      </div>

      <main class="view-part" id="view-vault" hidden>
        <div class="banner vmsg" id="v-msg" hidden></div>
        <section class="panel steps" id="v-steps" aria-label="Vault incident to test">
          <div class="step">
            <label class="q" for="v-inc"><span id="v-q1"></span></label>
            <select id="v-inc"></select>
            <span class="note" id="v-n1"></span>
          </div>
          <div class="step" id="v-sevstep">
            <label class="q" for="v-sev"><span id="v-q2"></span></label>
            <div class="slide">
              <div class="tcol">
                <input type="range" id="v-sev" min="0" max="1000" step="1" aria-label="Severity" />
                <div class="vticks" id="v-ticks"></div>
              </div>
              <output id="v-sevOut" for="v-sev"></output>
            </div>
            <span class="note" id="v-sevNote"></span>
          </div>
        </section>
        <div class="cols" id="v-cols">
          <div class="main">
            <section class="panel rail" id="v-rail" role="group" aria-label="How long the incident lasts" hidden>
              <div class="rhead">
                <span class="q rq"></span>
                <label class="rlbl" for="v-durIn"><span class="rlt"></span>
                  <input id="v-durIn" class="rdur" type="text" autocomplete="off" spellcheck="false"
                /></label>
                <span class="rrec" id="v-rec"></span>
              </div>
              <div class="vrtrack">
                <div id="v-rmarks"></div>
                <input type="range" id="v-dur" min="0" max="1000" step="1" aria-label="How long the incident lasts" />
              </div>
              <div class="raxis" id="v-raxis"></div>
              <ul class="tlsum" id="v-dsum"></ul>
              <details class="tl" id="v-d-tl">
                <summary id="v-tlSum"></summary>
                <div id="v-tl"></div>
              </details>
            </section>
          <section class="panel">
            <div class="phead">
              <h2 id="v-chainHead"></h2>
              <div class="mode sm" role="group" aria-label="How to show the vault's dependencies">
                <button data-vdisp="list" aria-pressed="true" aria-label="Layers" title="Layers"><svg class="dicon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M2 8h12M2 12.5h12" /></svg></button
                ><button data-vdisp="graph" aria-pressed="false" aria-label="Graph" title="Graph"><svg class="dicon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.6 5.4 7.2 10.9M11.4 5.4 8.8 10.9M5.6 3.8h4.8" /><circle cx="3.6" cy="3.8" r="2" /><circle cx="12.4" cy="3.8" r="2" /><circle cx="8" cy="12.4" r="2" /></svg></button>
              </div>
            </div>
            <div class="vchain" id="v-chain"></div>
            <div id="v-more"></div>
          </section>
          </div>
          <aside class="side">
            <section class="panel decision" id="v-decision" aria-live="polite"></section>
          </aside>
        </div>
      </main>
    </div>

    <div class="drawer" id="drawer" hidden>
      <div class="in" id="drawerIn"></div>
    </div>

    <script src="../sample_data/dashboard.sample.js"></script>
    <script src="risk_model.js"></script>
    <script src="../sample_data/vaults.sample.js"></script>
    <script src="demo.copy.js"></script>
    <script src="demo.js"></script>
    <script src="vault.js"></script>
  </body>
</html>
